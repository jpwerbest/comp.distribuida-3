# Arquitetura: Actor -> nginx (load balancer) -> wordpress1/2/3 -> mysql
# Acesso: http://localhost:8080

x-wordpress: &wordpress-common
  image: wordpress:6-php8.3-apache
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
  environment: &wordpress-env
    WORDPRESS_DB_HOST: mysql:3306
    WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    WORDPRESS_DB_USER: ${MYSQL_USER:-wpuser}
    WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wppass}
    # Chaves/salts IGUAIS nas 3 instâncias: sessões e cookies válidos em qualquer uma delas
    WORDPRESS_AUTH_KEY: ${WP_SALT:-troque-esta-chave-01}
    WORDPRESS_SECURE_AUTH_KEY: ${WP_SALT:-troque-esta-chave-02}
    WORDPRESS_LOGGED_IN_KEY: ${WP_SALT:-troque-esta-chave-03}
    WORDPRESS_NONCE_KEY: ${WP_SALT:-troque-esta-chave-04}
    WORDPRESS_AUTH_SALT: ${WP_SALT:-troque-este-salt-05}
    WORDPRESS_SECURE_AUTH_SALT: ${WP_SALT:-troque-este-salt-06}
    WORDPRESS_LOGGED_IN_SALT: ${WP_SALT:-troque-este-salt-07}
    WORDPRESS_NONCE_SALT: ${WP_SALT:-troque-este-salt-08}
    # URL pública = a que o visitante usou para chegar no nginx (localhost, Codespaces, túnel...).
    # Evita redirecionamentos para o host interno do container. ($$ escapa o $ no Compose)
    WORDPRESS_CONFIG_EXTRA: |
      $$scheme = (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) ? 'https' : 'http';
      define('WP_HOME', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
      define('WP_SITEURL', $$scheme . '://' . $$_SERVER['HTTP_HOST']);
  volumes:
    # Uploads, temas e plugins compartilhados entre as instâncias
    - wp_content:/var/www/html/wp-content
  networks:
    - backend

services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Trabalho 3: NGINX_CONF escolhe a variante com 1, 2 ou 3 instâncias (padrão = nginx.conf original)
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3
    networks:
      - backend

  wordpress1:
    <<: *wordpress-common
    container_name: wordpress1

  wordpress2:
    <<: *wordpress-common
    container_name: wordpress2

  wordpress3:
    <<: *wordpress-common
    container_name: wordpress3

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    # Trabalho 3: padrão do MySQL (151 conexões) esgotaria com 1000 usuários e geraria falhas do banco, não do WordPress
    command: --max_connections=1000
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wpuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wppass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend

  # ---------------- Trabalho 3 ----------------
  locust:                          # gerador de carga (só roda com --profile test)
    image: locustio/locust:2.29.1
    container_name: locust
    profiles: ["test"]
    environment:
      LOCUST_LOCUSTFILE: /mnt/locust/locustfile.py
      LOCUST_HOST: http://nginx    # nome do serviço do nginx no compose
      LOCUST_HEADLESS: "true"
      LOCUST_USERS: "10"
      LOCUST_SPAWN_RATE: "10"
      LOCUST_RUN_TIME: "60s"
      LOCUST_CSV: /results/teste
      LOCUST_EXIT_CODE_ON_ERROR: "0"   # falhas HTTP não devem abortar a bateria de testes
      SCENARIO: "1"
    volumes:
      - ./locust:/mnt/locust:ro
      - ./results:/results
    networks:
      - backend

  wpcli:                           # utilitário: instala o WP e cria os posts de teste
    image: wordpress:cli
    container_name: wpcli
    profiles: ["tools"]
    user: "33:33"
    volumes_from:
      - wordpress1                 # usa os arquivos/wp-config do wordpress1
    volumes:
      - ./assets:/assets:ro
      - ./scripts:/scripts:ro
    networks:
      - backend

volumes:
  db_data:
  wp_content:

networks:
  backend:
    driver: bridge
