# Mesmo nginx.conf do Trabalho 2, com 3 servidor(es) no upstream.
# Diferenças: worker_connections 4096 (suporta 1000 usuários) e access_log off (não distorce o desempenho).
events { worker_connections 4096; }
http {
  access_log off;
  upstream wordpress { # configura um pool de endereço de servidores
      server wordpress1;
      server wordpress2;
      server wordpress3;
  }
  server { # configura esse servidor
      listen 80 default_server; # escutando por conexões na porta 80
      listen [::]:80 default_server;
      root /usr/share/nginx/html;
      index index.php;
      location / {
        add_header X-Upstream $upstream_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header x-forwarded-for $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_pass http://wordpress;
      }
  }
}
